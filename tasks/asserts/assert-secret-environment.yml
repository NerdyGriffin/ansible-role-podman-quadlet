---

- name: Assert podman_quadlet_secret_environment is a dict
  ansible.builtin.assert:
    that:
      - podman_quadlet_secret_environment is mapping
    fail_msg: >-
      The variable 'podman_quadlet_secret_environment' must be a mapping
      (dict of KEY: value pairs). Got type
      {{ podman_quadlet_secret_environment | type_debug }}.

- name: Assert podman_quadlet_secret_environment keys are non-empty strings
  ansible.builtin.assert:
    that:
      - item is string
      - item | length > 0
      - item | regex_search('^[A-Za-z_][A-Za-z0-9_]*$') is not none
    fail_msg: >-
      Key '{{ item }}' in podman_quadlet_secret_environment is not a valid
      systemd EnvironmentFile variable name (must match [A-Za-z_][A-Za-z0-9_]*).
  loop: "{{ podman_quadlet_secret_environment.keys() | list }}"
  loop_control:
    label: "{{ item }}"
  when: podman_quadlet_secret_environment | length > 0
