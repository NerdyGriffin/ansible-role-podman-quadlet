---

# Detect firewalld via a single `systemctl is-active` instead of
# ansible.builtin.service_facts. service_facts enumerates EVERY systemd
# unit on the host (30-60s on busy systems with libvirt / kubernetes /
# many timers), and the role's only consumer of that data is the
# yes/no question below. `systemctl is-active firewalld.service` answers
# the same question in ~100ms.
#
# Cached across import_role invocations within a play: once
# podman_quadlet_firewall_status is set (from defaults '' → here), the
# block is skipped on subsequent calls. With 10+ containers per play
# that's saving 5-10 minutes of wall-clock time.
- name: Determine firewalld status (cached across role invocations)
  when: podman_quadlet_firewall_status is not defined or (podman_quadlet_firewall_status | length) == 0
  block:
    - name: Probe firewalld active state  # noqa: command-instead-of-module
      # ansible.builtin.systemd would issue several `systemctl show` calls
      # to populate its full output — defeats the whole point of the swap.
      # A direct `systemctl is-active` is one process, one syscall.
      ansible.builtin.command:
        cmd: systemctl is-active firewalld.service
      register: _firewalld_active
      changed_when: false
      failed_when: false
      check_mode: false  # must run under --check too so dryruns reach the rest

    - name: Set firewall status from probe
      ansible.builtin.set_fact:
        podman_quadlet_firewall_status: >-
          {{ 'running' if (_firewalld_active.stdout | trim) == 'active' else 'inactive' }}

- name: Assert that podman_quadlet_firewall_ports is defined and iterable
  ansible.builtin.assert:
    that:
      - podman_quadlet_firewall_ports is defined
      - podman_quadlet_firewall_ports is iterable
    fail_msg: >-
      podman_quadlet_firewall_ports must be defined and be a list.

# Assert firewall port list
# valid port examples:
# - 80/tcp
# - 443/tcp
# - 1024-2048/tcp
# - 32768-60999/udp
#
# invalid port examples:
# - 0/tcp
# - 70000/tcp
# - 9000-8000/tcp
# - 80/http
# - abc/tcp

- name: Assert firewall port format
  ansible.builtin.assert:
    that:
      - item is match('^\d{1,5}(-\d{1,5})?/(tcp|udp)$')
    fail_msg: >-
      Invalid firewall port format '{{ item }}'.
      Expected <port>/{tcp|udp} or <start>-<end>/{tcp|udp}.
  loop: "{{ podman_quadlet_firewall_ports }}"
  loop_control:
    label: "{{ item }}"

- name: Parse port numbers
  ansible.builtin.set_fact:
    _fw_parts: "{{ item.split('/')[0].split('-') }}"
  loop: "{{ podman_quadlet_firewall_ports }}"
  loop_control:
    label: "{{ item }}"

- name: Assert valid port numbers and ranges
  ansible.builtin.assert:
    that:
      - >-
          (
            _fw_parts | length == 1
            and _fw_parts[0] | int >= 1
            and _fw_parts[0] | int <= 65535
          )
          or
          (
            _fw_parts | length == 2
            and _fw_parts[0] | int >= 1
            and _fw_parts[1] | int <= 65535
            and _fw_parts[0] | int <= _fw_parts[1] | int
          )
    fail_msg: >-
      Invalid firewall port range '{{ item }}'.
      Ports must be between 1 and 65535 and ranges must be ascending.
  loop: "{{ podman_quadlet_firewall_ports }}"
  loop_control:
    label: "{{ item }}"
