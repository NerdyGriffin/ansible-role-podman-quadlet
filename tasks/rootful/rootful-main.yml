---

- name: Render rootful EnvironmentFile for vault-encrypted secret_environment
  ansible.builtin.import_tasks: rootful-secret-env.yml

- name: Copy/Render quadlet unit files/templates
  ansible.builtin.import_tasks: rootful-quadlets.yml

# Aggregate "did anything change?" from the unit-file and envfile render tasks
# above. This drives the conditional restart at the end so repeat invocations
# of the role are idempotent — no spurious container churn on every play run.
- name: Aggregate quadlet/envfile change status
  ansible.builtin.set_fact:
    podman_quadlet_unit_changed: >-
      {{
        (podman_quadlet_envfile_render_result.changed | default(false))
        or (podman_quadlet_envfile_remove_result.changed | default(false))
        or (
          (podman_quadlet_template_render_results.results | default([]))
          | selectattr('changed', 'defined')
          | selectattr('changed')
          | list | length > 0
        )
        or (
          (podman_quadlet_plain_copy_results.results | default([]))
          | selectattr('changed', 'defined')
          | selectattr('changed')
          | list | length > 0
        )
      }}
    podman_quadlet_has_staging: >-
      {{
        (podman_quadlet_volumes_files_to_stage | default([]) | length > 0)
        or (podman_quadlet_volumes_config_patches | default([]) | length > 0)
      }}

- name: Pre-pull container images
  ansible.builtin.import_tasks: rootful-pre-pull-images.yml
  when: podman_quadlet_pre_pull_images | bool

# Volume-staging dance: the role can pre-populate Podman-named volumes by
# starting the container once (so Podman creates the volume mountpoints),
# stopping it, copying files into the mountpoints, then restarting. The
# whole dance is unnecessary — and disruptively restarts a healthy container
# — when there is nothing to stage, so the entire block is gated on the
# presence of staging configuration.
- name: Stage files into Podman-named volumes
  when: podman_quadlet_has_staging | bool
  block:
    - name: Initial start of the rootful container to create the volumes
      ansible.builtin.import_tasks: rootful-systemd-start.yml

    - name: Stop the rootful container, to be able to deploy files to the volumes
      ansible.builtin.import_tasks: rootful-systemd-stop.yml

    - name: Deploy files into all Podman quadlet volumes
      ansible.builtin.include_tasks: rootful-deploy-volume-files.yml
      loop: "{{ podman_quadlet_volumes_files_to_stage | default([]) }}"
      loop_control:
        loop_var: volume

    - name: Patch config files in all Podman quadlet volumes
      ansible.builtin.include_tasks: rootful-patch-volume-configs.yml
      loop: "{{ podman_quadlet_volumes_config_patches | default([]) }}"
      loop_control:
        loop_var: volume

# A .timer unit, when present, is the activation mechanism for this app — the
# accompanying (typically Type=oneshot) service is fired on schedule by the
# timer rather than kept running. This changes the idempotent-fallback below.
- name: Determine whether a timer unit accompanies this app
  ansible.builtin.set_fact:
    podman_quadlet_has_timer: >-
      {{
        (podman_quadlet_resolved_files | default([]))
        | selectattr('name', 'match', '.*\.timer(\.j2)?$')
        | list | length > 0
      }}

# Restart if the unit file (or envfile, or staged volume files) actually
# changed. For a Type=oneshot service this runs it once to apply the change
# immediately rather than waiting for the next timer fire.
- name: Restart rootful container (unit changed or volume staging happened)
  ansible.builtin.import_tasks: rootful-systemd-restart.yml
  when: podman_quadlet_unit_changed | bool or podman_quadlet_has_staging | bool

# Idempotent fallback: ensure a long-running service stays up. Skipped when a
# .timer drives activation — for a Type=oneshot service, `state: started` would
# re-run the oneshot on every play; the timer fires it on schedule instead.
- name: Ensure rootful container is running (idempotent fallback)
  ansible.builtin.import_tasks: rootful-systemd-start.yml
  when:
    - not (podman_quadlet_unit_changed | bool or podman_quadlet_has_staging | bool)
    - not (podman_quadlet_has_timer | bool)

# Ensure the timer is active so its schedule is honored. `state: started`
# (not restarted) so a Persistent= timer's missed-run tracking isn't reset.
- name: Ensure rootful timer unit is started (when a .timer was deployed)
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ podman_quadlet_app_name }}.timer"
    state: started
  when: podman_quadlet_has_timer | bool
