---
# Render (or remove) the EnvironmentFile holding vault-encrypted secrets.
# Runs before quadlet templates so that .container.j2 files can reference
# `podman_quadlet_envfile_path` in an EnvironmentFile= directive.

- name: Set rootful systemd directory path (if not already set)
  ansible.builtin.set_fact:
    podman_quadlet_systemd_dir: "/etc/containers/systemd"
  when: podman_quadlet_systemd_dir | length == 0

- name: Compute rootful envfile path
  ansible.builtin.set_fact:
    podman_quadlet_envfile_path: >-
      {{ podman_quadlet_systemd_dir }}/{{ podman_quadlet_app_name }}/{{ podman_quadlet_app_name }}.env

- name: Ensure rootful systemd directory exists (for envfile)
  become: true
  ansible.builtin.file:
    path: "{{ podman_quadlet_systemd_dir }}/{{ podman_quadlet_app_name }}"
    state: directory
    mode: "0700"

- name: Render rootful EnvironmentFile (secret_environment non-empty)
  become: true
  ansible.builtin.template:
    src: envfile.j2
    dest: "{{ podman_quadlet_envfile_path }}"
    owner: root
    group: root
    mode: "0600"
  when: podman_quadlet_secret_environment | length > 0
  no_log: true
  register: podman_quadlet_envfile_render_result

- name: Remove rootful EnvironmentFile (secret_environment empty)
  become: true
  ansible.builtin.file:
    path: "{{ podman_quadlet_envfile_path }}"
    state: absent
  when: podman_quadlet_secret_environment | length == 0
  register: podman_quadlet_envfile_remove_result
