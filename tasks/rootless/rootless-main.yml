---

- name: Render rootless EnvironmentFile for vault-encrypted secret_environment
  ansible.builtin.import_tasks: rootless-secret-env.yml

- name: Copy/Render quadlet unit files/templates
  ansible.builtin.import_tasks: rootless-quadlets.yml

# Aggregate "did anything change?" from the unit-file and envfile render
# tasks above so we only force a restart when something actually changed.
- name: Aggregate quadlet/envfile change status
  ansible.builtin.set_fact:
    podman_quadlet_unit_changed: >-
      {{
        (podman_quadlet_envfile_render_result.changed | default(false))
        or (podman_quadlet_envfile_remove_result.changed | default(false))
        or (
          (podman_quadlet_template_render_results.results | default([]))
          | selectattr('changed', 'defined')
          | selectattr('changed')
          | list | length > 0
        )
        or (
          (podman_quadlet_plain_copy_results.results | default([]))
          | selectattr('changed', 'defined')
          | selectattr('changed')
          | list | length > 0
        )
      }}
    podman_quadlet_has_staging: >-
      {{
        (podman_quadlet_volumes_files_to_stage | default([]) | length > 0)
        or (podman_quadlet_volumes_config_patches | default([]) | length > 0)
      }}

# Pre-pull images so the first restart doesn't timeout waiting for
# a large image pull to complete within TimeoutStartSec.
- name: Pre-pull container images for rootless user
  ansible.builtin.import_tasks: rootless-pre-pull-images.yml
  when: podman_quadlet_pre_pull_images | bool

# This is a workaround, since starting the container is currently the only
# way to materialize Podman-named volumes (defined via .volume quadlets):
#
# 1) `podman volume create ...` independently bypasses the "use quadlets"
#    invariant.
# 2) `systemctl --user start $name-volume.service` did not work in
#    earlier podman versions.
# 3) Bind mounts in `.container` files sidestep the quadlet model.
#
# The workaround is to start the container once so podman creates the
# volume mountpoints, stop it, deploy files into the mountpoints, then
# restart. This whole dance is wasted work — and disruptively restarts a
# healthy container — when there's nothing to stage, so the entire block
# is gated on the presence of staging configuration.
- name: Stage files into Podman-named volumes
  when: podman_quadlet_has_staging | bool
  block:
    - name: Initial start of the rootless container to create the volumes
      ansible.builtin.import_tasks: rootless-systemd-start.yml

    - name: Stop the rootless container, to be able to deploy files to the volumes
      ansible.builtin.import_tasks: rootless-systemd-stop.yml

    - name: Deploy files into all Podman quadlet volumes
      ansible.builtin.include_tasks: rootless-deploy-volume-files.yml
      loop: "{{ podman_quadlet_volumes_files_to_stage | default([]) }}"
      loop_control:
        loop_var: volume

    - name: Patch config files in all Podman quadlet volumes
      ansible.builtin.include_tasks: rootless-patch-volume-configs.yml
      loop: "{{ podman_quadlet_volumes_config_patches | default([]) }}"
      loop_control:
        loop_var: volume

# Restart if the unit file (or envfile, or volume staging) actually changed.
# Falls back to a plain "ensure started" so a never-yet-started unit (first
# run on a fresh host) still comes up.
- name: Restart rootless container (unit changed or volume staging happened)
  ansible.builtin.import_tasks: rootless-systemd-restart.yml
  when: podman_quadlet_unit_changed | bool or podman_quadlet_has_staging | bool

- name: Ensure rootless container is running (idempotent fallback)
  ansible.builtin.import_tasks: rootless-systemd-start.yml
  when: not (podman_quadlet_unit_changed | bool or podman_quadlet_has_staging | bool)
