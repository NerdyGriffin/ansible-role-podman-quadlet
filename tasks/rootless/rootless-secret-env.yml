---
# Rootless counterpart of rootful-secret-env.yml. Renders the envfile under
# the rootless user's ~/.config/containers/systemd/<app>/ tree with the user
# as owner (mode 0600).

- name: Set rootless systemd directory path (if not already set)
  ansible.builtin.set_fact:
    podman_quadlet_systemd_dir: "{{ podman_quadlet_rootless_user_name_home_dir }}/.config/containers/systemd"
  when: podman_quadlet_systemd_dir | length == 0

- name: Compute rootless envfile path
  ansible.builtin.set_fact:
    podman_quadlet_envfile_path: >-
      {{ podman_quadlet_systemd_dir }}/{{ podman_quadlet_app_name }}/{{ podman_quadlet_app_name }}.env

- name: Ensure rootless systemd directory exists (for envfile)
  become: true
  ansible.builtin.file:
    path: "{{ podman_quadlet_systemd_dir }}/{{ podman_quadlet_app_name }}"
    state: directory
    mode: "0700"
    owner: "{{ podman_quadlet_rootless_user_name }}"
    group: "{{ podman_quadlet_rootless_user_name }}"

- name: Render rootless EnvironmentFile (secret_environment non-empty)
  become: true
  ansible.builtin.template:
    src: envfile.j2
    dest: "{{ podman_quadlet_envfile_path }}"
    owner: "{{ podman_quadlet_rootless_user_name }}"
    group: "{{ podman_quadlet_rootless_user_name }}"
    mode: "0600"
  when: podman_quadlet_secret_environment | length > 0
  no_log: true
  register: podman_quadlet_envfile_render_result

- name: Remove rootless EnvironmentFile (secret_environment empty)
  become: true
  ansible.builtin.file:
    path: "{{ podman_quadlet_envfile_path }}"
    state: absent
  when: podman_quadlet_secret_environment | length == 0
  register: podman_quadlet_envfile_remove_result
