# roles/podman_quadlet/defaults/main.yml
###############################################################################
# Public API
###############################################################################

###############################################################################
podman_quadlet_app_name: ''
###############################################################################
# mandatory: the application name
###############################################################################

###############################################################################
podman_quadlet_files_templates_src_path: ''
###############################################################################
# mandatory: Root path of files and templates folder, containing:
# <podman_quadlet_files_templates_src_path>
#   |- files
#   |    |- quadlets
#   |    |      |- application.pod
#   |    |      |- application-db.container
#   |    |      |- application-db-conf.volume
#   |    |      |- application-web-log.volume
#   |    |      |- ...
#   |    |- volumes
#   |           |- application-db-conf
#   |           |      |- app-db-conf.cfg
#   |           |- application-web-log
#   |                  |- logs-rotate.cfg
#   |- templates
#        |- quadlets
#        |      |- application-web.container.j2
#        |      |- ...
#        |- volumes
#               |- application-web-log
#                     |- logging.cfg.j2
#
###############################################################################

###############################################################################
podman_quadlet_file_names: ''
###############################################################################
# mandatory: a list of podman quadlet file names
# Currently supported quadlets:
#   $name.pod or $name.pod.j2
#   $name.container or $name.container.j2
#   $name.volume or $name.volume.j2
#   $name.network or $name.network.j2
# E.g.:
# podman_quadlet_file_names:
#   - application.pod
#   - application-db.container
#   - application-web.container.j2
#   - application-db-conf.volume
#   - application-web-log.volume
###############################################################################

###############################################################################
podman_quadlet_volumes_files_to_stage: []
###############################################################################
# optional: dict of files per volume to be staged
# --------------------------------------------------------------------------- #
# volumes example structure:
# --------------------------------------------------------------------------- #
# podman_quadlet_volumes_files_to_stage:
#   - name: application-web-log
#     files:
#       - src: app-db-conf.cfg
#         dest: /foo/bar/app-db-conf.cfg (Default: same as src)
#         state: file (Default: file for files and templates. Other possible value: directory )
#         owner: 0 (Default: 0. See note on rootless UID/GID below)
#         group: 0 (Default: 0. See note on rootless UID/GID below)
#         mode: "0600" (Default for files: 0644; Default for directories: "0755")
#
# Rootless UID/GID:
#   For rootless containers, owner/group are CONTAINER-PERSPECTIVE UIDs/GIDs.
#   E.g., owner: 33 means UID 33 inside the container (www-data), not UID 33
#   on the host. The role uses 'podman unshare chown' to map these correctly
#   through Podman's user namespace.
#   Default 0 = root inside the container = the rootless host user.
#
# Rootful UID/GID:
#   For rootful containers, owner/group are HOST UIDs/GIDs (no namespace
#   remapping). Default 0 = root on the host.
#
#       - src: peers/
#         state: directory
#         mode: "0700"
#
#       - src: peers/peer1.conf.j2
#         state: template
#         mode: "0600"
#
###############################################################################

###############################################################################
podman_quadlet_volumes_config_patches: []
###############################################################################
# optional: patches to apply to existing config files inside Podman volumes
# --------------------------------------------------------------------------- #
# Instead of replacing entire files, this patches specific values in existing
# configuration files that already live inside the volume (e.g. created by the
# container on first start).
# --------------------------------------------------------------------------- #
# podman_quadlet_volumes_config_patches:
#   - name: volume-name
#     patches:
#       - file: path/to/config.yml
#         format: yaml                     # yaml | json | ini | xml | keyvalue
#         owner: 0                         # container-perspective UID (default: 0)
#         group: 0                         # container-perspective GID (default: 0)
#         set:                             # for yaml/json/ini/keyvalue
#           key: value
#           nested.key: value              # dot-notation for yaml/json
#         section: ""                      # for ini format only
#         delimiter: "="                   # for keyvalue format only (default: "=")
#         xpath_patches:                   # for xml format only
#           - xpath: /config/server/port
#             value: "8096"
#
# Rootless UID/GID:
#   Same rules as podman_quadlet_volumes_files_to_stage: owner/group are
#   container-perspective UIDs/GIDs. The role uses 'podman unshare chown'
#   to map these correctly through Podman's user namespace.
#
# Rootful UID/GID:
#   owner/group are HOST UIDs/GIDs (no namespace remapping).
#
###############################################################################

###############################################################################
podman_quadlet_rootless_user_name: ''
###############################################################################
# optional: Linux user name for rootless container.
###############################################################################

###############################################################################
podman_quadlet_secret_environment: {}
###############################################################################
# optional: a dict of secret KEY=VALUE pairs rendered into a 0600 EnvironmentFile
# alongside the quadlet unit files. Values are expected to come from ansible-vault
# at the caller's site; no secrets ever land in the quadlet unit file itself.
#
# The file is written to:
#   <systemd_dir>/<app_name>/<app_name>.env   (mode 0600, owner root for rootful,
#                                              owner <rootless_user> for rootless)
# and the absolute path is exposed as the fact `podman_quadlet_envfile_path` so
# templates can reference it without duplicating the layout convention.
#
# To wire it into a container, reference it from your .container.j2 template:
#
#   [Container]
#   Image=ghcr.io/foo/bar:latest
#   EnvironmentFile={{ podman_quadlet_envfile_path }}
#
# Or hard-code the path in a plain .container file when you don't need a
# template (the path is deterministic from app_name).
#
# When the dict is empty (the default), the env file is ensured absent — removing
# a secret from your config cleans up the on-disk file on the next run.
#
# Example (in your playbook, with vault-encrypted values):
#   podman_quadlet_secret_environment:
#     API_TOKEN: "{{ vault_api_token }}"
#     DB_PASSWORD: "{{ vault_db_password }}"
#
# Keys are sorted on render so file contents are deterministic across runs.
# Values are passed through as-is (be careful with embedded newlines or quotes;
# the file uses systemd EnvironmentFile syntax: KEY=VALUE per line).
###############################################################################

###############################################################################
podman_quadlet_min_podman_major: 5
###############################################################################
# optional: minimum major version of podman required on the target host.
# Default 5 matches the role's original requirement and is the safe choice
# when using podman-5-only features. Quadlet itself has been in podman since
# 4.4, so basic .container / .volume / .network unit deployments work fine
# on podman 4.x; set this to 4 on RHEL 8 / Rocky 8 (which ship podman 4.9.x
# via container-tools) when your use case does not depend on podman-5-only
# directives.
###############################################################################

###############################################################################
podman_quadlet_pre_pull_images: true
###############################################################################
# optional: Pre-pull container images before restarting the service.
# Parses Image= from deployed .container quadlet files and runs
# podman pull for each unique image. Prevents systemd timeout on
# first deploy when images aren't cached locally.
# Set to false to skip pre-pulling.
###############################################################################

###############################################################################
podman_quadlet_pull_policy: "newer"
###############################################################################
# optional: --policy value passed to `podman pull` during pre-pull.
# Default "newer" consults the registry's manifest and only pulls
# changed layers, avoiding a full re-download when the local image is
# already up to date. When the registry itself is unreachable (e.g.
# Docker Hub anonymous-pull rate limit) and the image is already
# cached locally, the task falls back to the cached image with a
# warning instead of failing the play; this keeps redeploys resilient
# to transient registry failures without silently diverging on first
# install (no cached image + pull fails = hard fail).
# Other accepted values (podman pull --policy):
#   always   — pull every time, re-downloading unchanged layers
#   missing  — pull only when the image is not already local
#   newer    — pull when remote is strictly newer than local (default)
#   never    — never pull; fail if not already cached
###############################################################################

###############################################################################
podman_quadlet_firewall_ports: []
###############################################################################
# optional: firewall ports to manage
# e.g.: 8080/tcp or 9090/udp
# podman_quadlet_firewall_ports:
#   - 8080/tcp
#   - 9090/udp
#   - 32768-60999/tcp
#   - 32768-60999/udp
###############################################################################

###############################################################################
podman_quadlet_firewall_port_forwards: []
###############################################################################
# optional: firewall port forwards to manage
# Useful for rootless containers that cannot bind to privileged ports (< 1024).
# Each entry forwards a host port to a container port.
#
# podman_quadlet_firewall_port_forwards:
#   - port: 443
#     proto: tcp
#     toport: 8443
#   - port: 53
#     proto: udp
#     toport: 1053
###############################################################################

###############################################################################
# Internally computed by the role - no need to set something
###############################################################################
# Rootless user uid
podman_quadlet_rootless_user_uid: ''

# Rootless user gid
podman_quadlet_rootless_user_gid: ''

# Full path name of the container src file/template on localhost
podman_quadlet_src_container_file_name_full_path: ''

# Full path name of the systemd folder on remote system
# set in tasks/
podman_quadlet_systemd_dir: ''

# Full path of the rendered EnvironmentFile for secret_environment.
# Set by tasks/<rootful|rootless>-secret-env.yml; reference it from your
# .container.j2 template as: EnvironmentFile={{ podman_quadlet_envfile_path }}
podman_quadlet_envfile_path: ''

# Firewall status set in asserts/assert-firewall.yml
podman_quadlet_firewall_status: ''

# List of the full path name of all quadlet files
podman_quadlet_resolved_files: []

# List of the full path name of all files to be deployed to volumes
# Set in tasks/asserts/
podman_quadlet_resolved_volume_files: []
